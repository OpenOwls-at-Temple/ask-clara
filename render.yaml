# ⚠️ NOT CURRENTLY AUTHORITATIVE. The staging service (clara-backend) was created
# manually in the Render dashboard, not from this Blueprint — the account shows no
# Blueprints, so Render never reads this file. Nothing here takes effect: settings
# and env vars must be changed in the dashboard, and this file kept in sync by hand.
# Adopting it as a real Blueprint is an open decision (see progress.md → Up Next).
services:
  - type: web
    name: clara-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Liveness probe. Deliberately a route with no DB calls, so a brief
    # Postgres/Mongo outage can't fail the health check and trigger a restart loop.
    # Set by hand at Settings → Health Checks; this line is a mirror, not the source.
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: temple.edu
      - key: FRONTEND_ORIGIN
        sync: false
